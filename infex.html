<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Bouquet 💐</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Poppins", Arial, sans-serif;
        background: linear-gradient(135deg, #fff0f5, #ffe4ec);
        color: #4a2c35;
        min-height: 100vh;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 25px 15px;
    }

    header h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        color: #d85b7a;
    }

    header p {
        margin-top: 8px;
        color: #7b4b58;
    }

    .bouquet-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .bouquet {
        position: relative;
        width: min(90vw, 420px);
        height: 420px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Flowers */
    .flower {
        position: absolute;
        font-size: 70px;
        animation: float 3s ease-in-out infinite;
    }

    .f1 { top: 20px; left: 50%; transform: translateX(-50%); }
    .f2 { top: 70px; left: 15%; animation-delay: .3s; }
    .f3 { top: 70px; right: 15%; animation-delay: .6s; }
    .f4 { top: 140px; left: 5%; animation-delay: .9s; }
    .f5 { top: 140px; right: 5%; animation-delay: 1.2s; }
    .f6 { top: 135px; left: 50%; transform: translateX(-50%); animation-delay: 1.5s; }

    @keyframes float {
        0%, 100% { margin-top: 0; }
        50% { margin-top: -10px; }
    }

    /* Wrapping paper */
    .paper {
        position: absolute;
        bottom: 20px;
        width: 270px;
        height: 190px;
        background: #f5c6d6;
        clip-path: polygon(8% 0, 92% 0, 70% 100%, 30% 100%);
        z-index: 2;
    }

    .ribbon {
        position: absolute;
        bottom: 45px;
        width: 80px;
        height: 30px;
        background: #c94f70;
        border-radius: 50%;
        z-index: 3;
    }

    .ribbon::before,
    .ribbon::after {
        content: "";
        position: absolute;
        width: 55px;
        height: 55px;
        background: #c94f70;
        top: -12px;
        border-radius: 50% 50% 10% 50%;
    }

    .ribbon::before {
        right: 45px;
        transform: rotate(-25deg);
    }

    .ribbon::after {
        left: 45px;
        transform: rotate(25deg);
    }

    .message {
        text-align: center;
        max-width: 600px;
        margin: 0 auto 25px;
        padding: 0 20px;
    }

    .message h2 {
        font-size: 1.8rem;
        color: #c94f70;
        margin-bottom: 10px;
    }

    .message p {
        line-height: 1.6;
    }

    button {
        display: block;
        margin: 20px auto 40px;
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        background: #d85b7a;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(216, 91, 122, .3);
        transition: .2s;
    }

    button:hover {
        transform: scale(1.05);
        background: #c94f70;
    }

    /* Confetti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 999;
        pointer-events: none;
        animation: fall linear forwards;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    footer {
        text-align: center;
        padding: 20px;
        font-size: .9rem;
        color: #8a5b67;
    }

    @media (max-width: 480px) {
        .bouquet {
            height: 350px;
        }

        .flower {
            font-size: 55px;
        }

        .paper {
            width: 230px;
            height: 160px;
        }

        .message h2 {
            font-size: 1.5rem;
        }

        button {
            width: 85%;
        }
    }
</style>
</head>

<body>

<header>
    <h1>💐 Bloom Bouquet</h1>
    <p>A little bouquet made with love 🌷</p>
</header>

<section class="bouquet-section">
    <div class="bouquet">

        <div class="flower f1">🌸</div>
        <div class="flower f2">🌷</div>
        <div class="flower f3">🌹</div>
        <div class="flower f4">🌼</div>
        <div class="flower f5">🌺</div>
        <div class="flower f6">🌻</div>

        <div class="paper"></div>
        <div class="ribbon"></div>

    </div>
</section>

<div class="message">
    <h2>For Someone Special 💗</h2>
    <p>
        Flowers may fade, but the memories and feelings
        behind them can last forever.
    </p>
</div>

<button onclick="celebrate()">
    💐 Send the Bouquet
</button>

<footer>
    Made with 💕 and flowers
</footer>

<script>
function celebrate() {

    for (let i = 0; i < 120; i++) {

        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        const colors = [
            "#ff6b81",
            "#ffd166",
            "#06d6a0",
            "#4dabf7",
            "#c77dff",
            "#ff9f1c"
        ];

        confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.width =
            Math.random() * 8 + 6 + "px";

        confetti.style.height =
            Math.random() * 8 + 6 + "px";

        confetti.style.animationDuration =
            Math.random() * 3 + 2 + "s";

        confetti.style.animationDelay =
            Math.random() * 0.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5500);
    }
}
</script>

</body>
</html>
